; plugin.ini - optional.
; frame=1 (default): custom frame, colours show at once. frame=0: static effect, which the firmware fades (blurs fast changes).
; led=0 averages all 22 LEDs into one colour; led=1..22 follows one LED.
; per_key=1 sends each key its own iCUE colour (a pattern across the keypad) instead of one colour (no smoothing then).
; boost=1 (off by default) stretches the brightness range so a small, dark Mural area still visibly pulses; boost=0 sends iCUE colours as they are.
; smooth_ms=35 glides between the ~17-21 frames/s iCUE hands over (lower = snappier, 0 = off, higher = softer).
[tartarus]
frame=1
led=0
per_key=0
boost=0
smooth_ms=35
