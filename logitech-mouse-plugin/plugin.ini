; plugin.ini - which Logitech mouse the iCUE plugin shows, and its lighting zones.
; Edit, then run Install-LogitechPlugin.ps1 again (or restart iCUE) to apply.
;
; zoneN_id    = the zone number in Logitech's LED SDK for your mouse
; zoneN_shape = where the zone is drawn in iCUE: wheel, logo, dpi, side or body
; zoneN_name  = label shown in iCUE
;
; Zone numbers from Logitech's LED SDK 9.00 documentation:
;   G403 / G703 (default) : 0 = scroll wheel, 1 = logo
;   G900 / G903           : 0 = DPI indicator, 1 = logo
;   G303 Daedalus Apex    : 0 = side lighting, 1 = logo
;   PRO Gaming Mouse      : 0 = logo and side lighting (zones=1)
; Newer mice are not in that document: start with zones=2, ids 0 and 1, and see
; what lights up (the plugin log lists what it sends).

[mouse]
name=Logitech G403 HERO
zones=2

zone1_name=Scroll wheel
zone1_id=0
zone1_shape=wheel

zone2_name=Logo
zone2_id=1
zone2_shape=logo
