<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6fbfd"/>
      <stop offset="0.35" stop-color="#9fe7f0"/>
      <stop offset="0.7" stop-color="#4fb3c4"/>
      <stop offset="1" stop-color="#2a7f8f"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fe3ef"/>
      <stop offset="0.5" stop-color="#f2feff"/>
      <stop offset="1" stop-color="#7fe3ef"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f3a3f"/>
      <stop offset="1" stop-color="#151b1e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- halo behind the shield -->
  <path d="M256 40 L430 104 V250 C430 360 352 432 256 472 C160 432 82 360 82 250 V104 Z"
        fill="#5fd4e4" opacity="0.35" filter="url(#softglow)"/>
  <!-- shield -->
  <path d="M256 40 L430 104 V250 C430 360 352 432 256 472 C160 432 82 360 82 250 V104 Z"
        fill="url(#body)" stroke="url(#rgb)" stroke-width="14" stroke-linejoin="round"/>
  <!-- inner bevel -->
  <path d="M256 70 L404 124 V250 C404 344 338 408 256 442 C174 408 108 344 108 250 V124 Z"
        fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>
  <!-- visor: the warden's eye -->
  <path d="M138 196 L170 172 H342 L374 196 L342 214 H170 Z" fill="url(#visor)" filter="url(#glow)"/>
  <path d="M182 190 H330" stroke="#ffffff" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round"/>
  <!-- W chevron -->
  <path d="M158 250 L206 360 L256 286 L306 360 L354 250"
        fill="none" stroke="url(#rgb)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
