<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="420" viewBox="0 0 1280 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#252a2d"/>
      <stop offset="1" stop-color="#2e3437"/>
    </linearGradient>
    <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6fbfd"/>
      <stop offset="0.35" stop-color="#9fe7f0"/>
      <stop offset="0.7" stop-color="#4fb3c4"/>
      <stop offset="1" stop-color="#2a7f8f"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.22" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5fd4e4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5fd4e4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="wmglow" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <linearGradient id="ice" gradientUnits="userSpaceOnUse" x1="430" y1="150" x2="430" y2="205">
      <stop offset="0" stop-color="#f2feff"/>
      <stop offset="0.55" stop-color="#9fe7f0"/>
      <stop offset="1" stop-color="#4fb3c4"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="420" rx="24" fill="url(#spot)"/>

  <image x="70" y="50" width="320" height="320" xlink:href="LOGO_PNG"/>

  <text x="430" y="200" font-family="Orbitron" font-weight="700" font-size="62" letter-spacing="6" fill="url(#ice)" filter="url(#wmglow)" opacity="0.8">SENTINEL ARMORY</text>
  <text x="430" y="200" font-family="Orbitron" font-weight="700" font-size="62" letter-spacing="6" fill="url(#ice)">SENTINEL ARMORY</text>
  <text x="433" y="272" font-family="Rajdhani" font-weight="600" font-size="30" fill="#a9c4c9">Small, sharp tools that keep a home rig in line.</text>

  <!-- project chips -->
  <g font-family="Rajdhani" font-weight="600" font-size="22" fill="#e4e4e7">
    <g transform="translate(433 304)">
      <rect width="232" height="40" rx="20" fill="#ffffff" fill-opacity="0.05" stroke="#7fe3ef" stroke-opacity="0.6"/>
      <circle cx="22" cy="20" r="7" fill="#9fe7f0" filter="url(#glow)"/>
      <text x="40" y="27">SENTINEL WARDEN</text>
    </g>
    <g transform="translate(679 304)">
      <rect width="170" height="40" rx="20" fill="#ffffff" fill-opacity="0.03" stroke="#7fe3ef" stroke-opacity="0.25" stroke-dasharray="4 4"/>
      <text x="22" y="27" fill="#7d9196">MORE SOON</text>
    </g>
  </g>
</svg>
