<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="420" viewBox="0 0 1280 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e15"/>
      <stop offset="1" stop-color="#11131c"/>
    </linearGradient>
    <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.35" stop-color="#6366f1"/>
      <stop offset="0.65" stop-color="#d946ef"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.22" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="420" rx="24" fill="url(#spot)"/>

  <image x="70" y="50" width="320" height="320" xlink:href="LOGO_PNG"/>

  <text x="430" y="190" font-family="Orbitron" font-weight="800" font-size="78" letter-spacing="4" fill="#f4f4f5">SENTINEL</text>
  <text x="430" y="272" font-family="Orbitron" font-weight="800" font-size="78" letter-spacing="4" fill="url(#rgb)" filter="url(#glow)">WARDEN</text>
  <text x="433" y="322" font-family="Rajdhani" font-weight="600" font-size="30" fill="#a1a1aa">Every light on your desk, under one command: Corsair iCUE.</text>

  <!-- device chips -->
  <g font-family="Rajdhani" font-weight="600" font-size="22" fill="#e4e4e7">
    <g transform="translate(433 350)">
      <rect width="196" height="40" rx="20" fill="#ffffff" fill-opacity="0.05" stroke="#22d3ee" stroke-opacity="0.6"/>
      <circle cx="22" cy="20" r="7" fill="#22d3ee" filter="url(#glow)"/>
      <text x="40" y="27">ASUS AURA GPU</text>
    </g>
    <g transform="translate(643 350)">
      <rect width="246" height="40" rx="20" fill="#ffffff" fill-opacity="0.05" stroke="#d946ef" stroke-opacity="0.6"/>
      <circle cx="22" cy="20" r="7" fill="#d946ef" filter="url(#glow)"/>
      <text x="40" y="27">ASUS MOTHERBOARD</text>
    </g>
    <g transform="translate(903 350)">
      <rect width="212" height="40" rx="20" fill="#ffffff" fill-opacity="0.05" stroke="#f97316" stroke-opacity="0.6"/>
      <circle cx="22" cy="20" r="7" fill="#f97316" filter="url(#glow)"/>
      <text x="40" y="27">LOGITECH G403</text>
    </g>
  </g>
</svg>
